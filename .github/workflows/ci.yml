name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (unit + H2 + PostgreSQL Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven wrapper executable
        working-directory: backend
        run: chmod +x mvnw

      # `verify` runs Surefire unit tests, Failsafe H2 integration tests,
      # and the real PostgreSQL Testcontainers test. GitHub-hosted runners
      # provide Docker, so the PostgreSQL test is not skipped in CI.
      - name: Run backend verify
        working-directory: backend
        run: ./mvnw -B verify

  frontend:
    name: Frontend (tests + production build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Vitest
        working-directory: frontend
        run: npm test

      - name: Production build
        working-directory: frontend
        run: npm run build

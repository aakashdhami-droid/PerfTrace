# ── PerfTrace Test Configuration ──
spring.datasource.url=jdbc:h2:mem:perftrace_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.flyway.enabled=false

perftrace.jwt.secret=test-secret-key-that-is-at-least-256-bits-long-for-hs256-algorithm-testing
perftrace.jwt.expiration-ms=3600000

perftrace.analysis.window-seconds=10
perftrace.analysis.max-rows=100000
perftrace.analysis.smoothing-seconds=20

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

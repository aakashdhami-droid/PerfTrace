# ── PerfTrace Backend Configuration ──
# Values reference environment variables. See .env.example for setup.

spring.application.name=PerfTrace

# ── Database ──
spring.datasource.url=${PERFTRACE_DB_URL:jdbc:postgresql://localhost:5432/perftrace}
spring.datasource.username=${PERFTRACE_DB_USER:perftrace}
spring.datasource.password=${PERFTRACE_DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=10

# ── JPA / Hibernate ──
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true

# ── Flyway ──
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ── File Upload ──
spring.servlet.multipart.max-file-size=${PERFTRACE_MAX_UPLOAD_SIZE:50MB}
spring.servlet.multipart.max-request-size=${PERFTRACE_MAX_UPLOAD_SIZE:50MB}

# ── JWT ──
perftrace.jwt.secret=${PERFTRACE_JWT_SECRET:}
perftrace.jwt.expiration-ms=${PERFTRACE_JWT_EXPIRATION_MS:86400000}

# ── Analysis Defaults ──
perftrace.analysis.window-seconds=10
perftrace.analysis.max-rows=500000
perftrace.analysis.smoothing-seconds=20

# ── CORS ──
perftrace.cors.allowed-origins=${PERFTRACE_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

# ── Server ──
server.port=${PERFTRACE_PORT:8080}

# ── OpenAPI / Swagger ──
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
